version: '3'

env:
  GOWORK: 'off'

vars:
  GOVULNCHECK_VERSION: v1.8.0
  GOLANGCI_LINT_VERSION: v2.14.0

tasks:
  default:
    cmds: [{task: build}]
  list:
    desc: List available tasks
    cmds: ['task --list-all']
  fmt:
    desc: Format Go source
    cmds: ['gofmt -w .']
  fmt-check:
    desc: Check Go formatting without changing files
    cmds:
      - |
        files="$(gofmt -l .)"
        if [ -n "$files" ]; then printf '%s\n' "$files"; exit 1; fi
  go-tidy:
    desc: Update native module metadata
    cmds: ['go mod tidy', 'go -C examples mod tidy']
  go-tidy-check:
    aliases: [tidy-check]
    desc: Check native module metadata without changing files
    cmds: ['go mod tidy -diff', 'go -C examples mod tidy -diff']
  go-verify:
    desc: Verify downloaded module contents
    cmds: ['go mod verify', 'go -C examples mod verify']
  test:
    desc: Run native tests
    cmds: ['go test -mod=readonly ./...', 'go -C examples test -mod=readonly ./...']
  test-race:
    desc: Run native tests with the race detector
    cmds: ['go test -mod=readonly -race ./...', 'go -C examples test -mod=readonly -race ./...']
  test-no-cgo:
    desc: Test without CGO
    env: {CGO_ENABLED: '0'}
    cmds: ['go test -mod=readonly ./...', 'go -C examples test -mod=readonly ./...']
  vet:
    desc: Run Go vet
    cmds: ['go vet -mod=readonly ./...', 'go -C examples vet -mod=readonly ./...']
  lint-install:
    internal: true
    run: once
    env: {GOOS: '', GOARCH: '', GOBIN: '{{.ROOT_DIR}}/.task/bin'}
    cmds: ['go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@{{.GOLANGCI_LINT_VERSION}}']
  lint:
    desc: Run pinned golangci-lint on the library and examples
    cmds:
      - task: lint-install
      - '"{{.ROOT_DIR}}/.task/bin/golangci-lint" run'
      - cmd: '"{{.ROOT_DIR}}/.task/bin/golangci-lint" run'
        dir: examples
  build:
    desc: Build library and native example
    cmds:
      - go build -mod=readonly ./...
      - task: build-examples
  run-minimal:
    desc: Run the minimal Bubble Tea integration
    cmds: ['go -C examples run -mod=readonly ./minimal']
  run-logo:
    desc: Run the original canvas logo demo
    cmds: ['go -C examples run -mod=readonly ./logo']
  run-grids:
    desc: Compare styled, compact rune, and grapheme grids
    cmds: ['go -C examples run -mod=readonly ./grids']
  run-lines:
    desc: Compare raster lines and antialiased coverage
    cmds: ['go -C examples run -mod=readonly ./lines']
  run-viewports:
    desc: Explore shared storage, focus, input, and independent viewports
    cmds: ['go -C examples run -mod=readonly ./viewports']
  record-demo:
    desc: Record the viewport demo and refresh the README screenshot with ntrecord
    dir: '{{.ROOT_DIR}}'
    preconditions:
      - sh: command -v ntrecord
        msg: Install ntrecord (brew install --cask nimbleterminal/tap/ntrecord).
    cmds:
      - task: build-examples
      - mkdir -p dist docs/images
      - ntrecord validate examples/demo.tape
      - ntrecord -mode deterministic examples/demo.tape
      - cp dist/viewports.png docs/images/viewports.png
  cross-windows:
    desc: Check Windows compilation
    env: {GOOS: windows, GOARCH: amd64, CGO_ENABLED: '0'}
    cmds:
      - mkdir -p bin
      - go build -mod=readonly ./...
      - for: [logo, minimal, grids, lines, viewports]
        cmd: go -C examples build -mod=readonly -o ../bin/ntcanvas-{{.ITEM}}.exe ./{{.ITEM}}
  build-examples:
    desc: Build all native demos
    cmds:
      - mkdir -p bin
      - for: [logo, minimal, grids, lines, viewports]
        cmd: go -C examples build -mod=readonly -o ../bin/ntcanvas-{{.ITEM}} ./{{.ITEM}}
  build-wasm:
    desc: Build all browser demos
    env:
      GOWORK: '{{.ROOT_DIR}}/wasm.work'
      GOOS: js
      GOARCH: wasm
      CGO_ENABLED: '0'
    cmds:
      - mkdir -p web/demos
      - for: [logo, grids, lines, viewports]
        cmd: go -C examples build -mod=readonly -o ../web/demos/{{.ITEM}}.wasm ./{{.ITEM}}
  notices:
    desc: Regenerate dependency and browser runtime notices
    cmds: ['go run ./internal/tools/notices > THIRD_PARTY_NOTICES.md']
  notices-check:
    desc: Check generated notices without modifying tracked files
    cmds:
      - mkdir -p dist
      - go run ./internal/tools/notices > dist/THIRD_PARTY_NOTICES.md
      - cmp THIRD_PARTY_NOTICES.md dist/THIRD_PARTY_NOTICES.md
  build-wasm-site:
    desc: Build browser demos and export the pinned booba runtime
    cmds:
      - task: build-wasm
      - go -C examples tool booba-assets --no-index ../web
      - cp LICENSE NOTICE.md THIRD_PARTY_NOTICES.md web/
      - task: check-site
  check-site:
    desc: Check JavaScript syntax and required site assets
    cmds:
      - node --check web/site.js
      - node scripts/check-site.mjs
      - for: [logo, grids, lines, viewports]
        cmd: node scripts/smoke-demo.mjs {{.ITEM}}
      - task: test-screen
  test-screen:
    desc: Compare native/WASM canvas output with golden Ghostty terminal screens (build-wasm-site prepares runtime)
    cmds:
      - mkdir -p dist
      - go run ./internal/tools/screenframes > dist/screen-frames.json
      - node scripts/check-screen.mjs
      - task: test-screen-wasm
  test-screen-wasm:
    internal: true
    env:
      GOWORK: '{{.ROOT_DIR}}/wasm.work'
      GOOS: js
      GOARCH: wasm
      CGO_ENABLED: '0'
    cmds:
      - go build -mod=readonly -o dist/screen-frames.wasm ./internal/tools/screenframes
      - 'node "$(go env GOROOT)/lib/wasm/wasm_exec_node.js" dist/screen-frames.wasm > dist/screen-frames.json'
      - node scripts/check-screen.mjs
  serve-wasm-site:
    desc: Serve demos at http://localhost:8000/web/
    cmds:
      - task: build-wasm-site
      - python3 -m http.server 8000 --bind 127.0.0.1
  test-wasm:
    aliases: [wasm-test]
    desc: Run canvas and example tests under Node WASM
    env:
      GOWORK: '{{.ROOT_DIR}}/wasm.work'
      GOOS: js
      GOARCH: wasm
      CGO_ENABLED: '0'
    cmds:
      - 'go test -mod=readonly -exec="$(go env GOROOT)/lib/wasm/go_js_wasm_exec" ./... ./examples/...'
  vulncheck-install:
    internal: true
    run: once
    env: {GOOS: '', GOARCH: '', GOBIN: '{{.ROOT_DIR}}/.task/bin'}
    cmds: ['go install golang.org/x/vuln/cmd/govulncheck@{{.GOVULNCHECK_VERSION}}']
  vulncheck:
    desc: Scan native and browser dependencies (requires network)
    cmds:
      - task: vulncheck-install
      - '"{{.ROOT_DIR}}/.task/bin/govulncheck" -test ./...'
      - cmd: '"{{.ROOT_DIR}}/.task/bin/govulncheck" -test ./...'
        dir: examples
      - task: vulncheck-wasm
  vulncheck-wasm:
    desc: Scan dependencies with the browser fork (requires network)
    env:
      GOWORK: '{{.ROOT_DIR}}/wasm.work'
      GOOS: js
      GOARCH: wasm
      CGO_ENABLED: '0'
    cmds:
      - task: vulncheck-install
      - '"{{.ROOT_DIR}}/.task/bin/govulncheck" ./... ./examples/...'
  ci:
    desc: Full portable CI gate; no sibling repositories required
    cmds:
      - task: fmt-check
      - task: go-tidy-check
      - task: go-verify
      - task: test-race
      - task: test-no-cgo
      - task: vet
      - task: lint
      - task: cross-windows
      - task: build
      - task: build-wasm-site
      - task: notices-check
      - task: test-wasm
      - task: vulncheck
  clean:
    desc: Remove generated binaries and task tools
    cmds: ['rm -rf bin dist .task web/demos web/booba web/ghostty-web web/wasm_exec.js web/LICENSE web/NOTICE.md web/THIRD_PARTY_NOTICES.md']
