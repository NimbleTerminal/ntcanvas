name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    name: Check (${{ matrix.os }}, Go ${{ matrix.go }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        go: ['1.26.8', '1.27.2']
    runs-on: ${{ matrix.os }}
    env:
      # Do not silently upgrade the compiler when testing the minimum version.
      GOTOOLCHAIN: local
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
          cache-dependency-path: |
            go.sum
            examples/go.sum
            wasm.work.sum
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
      - uses: go-task/setup-task@v2
        with:
          version: '3.x'
      - name: Check minimum Go compatibility
        if: matrix.go == '1.26.8'
        run: |
          task test-race
          task vet
          task build
          task test-wasm
      - name: Run full CI
        if: matrix.go == '1.27.2'
        run: task ci
